# Apache 2.4+ — Angular static files behind a reverse proxy.
# Use mod_headers. Prefer edge-generated nonces; the example uses an env var set by a prior handler.

<VirtualHost *:443>
  ServerName app.example.com
  DocumentRoot /var/www/angular/browser

  <Directory /var/www/angular/browser>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    FallbackResource /index.html
  </Directory>

  # Start in report-only, then switch header name to Content-Security-Policy.
  <Location />
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'nonce-%{CSP_NONCE}e' 'strict-dynamic'; style-src 'self' 'nonce-%{CSP_NONCE}e'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.example.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /csp-report"
  </Location>

  ProxyPass /api/ http://127.0.0.1:3001/api/
  ProxyPassReverse /api/ http://127.0.0.1:3001/api/
</VirtualHost>
