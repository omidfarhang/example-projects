/* Sample nginx CSP for an Angular static host + API reverse proxy.
 *
 * Replace NONCE_PLACEHOLDER at the edge (preferred) or origin on every HTML response.
 * Start with add_header Content-Security-Policy-Report-Only … until reports are quiet.
 */

map $request_id $csp_nonce {
  # Prefer a cryptographically random nonce from your edge/CDN.
  # This map is illustrative — wire your real nonce source here.
  default "$request_id";
}

server {
  listen 443 ssl http2;
  server_name app.example.com;

  root /var/www/angular/browser;
  index index.html;

  # HTML documents: per-request nonce (do not long-cache HTML with a fixed nonce).
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.example.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /csp-report" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /csp-report {
    proxy_pass http://csp_collector;
  }
}
